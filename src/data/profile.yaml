# About opens with positioning B, "Adaptation is the craft".
bio:
  - "Adaptation is the craft. Every tool I mastered expired; re-tooling never did. Now I design in Figma, ship in code, and run a studio of AI agents."
  - "I've designed digital products since 2015, across banking, cybersecurity, healthcare and product startups. At CIMB Bank PH I led UI/UX for the digital banking app and later took on product ownership: the Figma design system, the roadmap, and features from discovery to release."
  - "Today I'm a lead designer at FLNT, where I design and build lease-intelligence products for retail property, and the design system under them. I work the whole loop myself, from research and design to front-end build and QA, with a team of AI agents doing the legwork. The decisions stay mine."

